<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        #root {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .sidebar h2 { margin-top: 0; font-size: 1.1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.8rem; margin-bottom: 1.5rem; }
        
        .game-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        
        .game-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,0.1); }
        .game-item.active { 
            background: rgba(59, 130, 246, 0.15); 
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        
        .game-item .delete-btn {
            background: transparent;
            color: #ef4444;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .game-item:hover .delete-btn { opacity: 1; }
        .game-item .delete-btn:hover { color: #f87171; text-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            overflow-y: auto;
        }
        
        .container {
            display: flex;
            gap: 2.5rem;
            max-width: 1300px;
            width: 100%;
        }
        
        .board-section {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .eval-bar-container {
            width: 24px;
            height: 500px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .eval-bar-fill {
            width: 100%;
            background-color: #f1f5f9;
            position: absolute;
            bottom: 0;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .eval-text-overlay {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: #94a3b8;
            z-index: 10;
            padding: 4px 0;
            pointer-events: none;
        }
        .eval-text-overlay.top { top: 0; }
        .eval-text-overlay.bottom { bottom: 0; }
        
        .board-container {
            width: 500px;
            height: 500px;
            background: #1e293b;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(59, 130, 246, 0.1);
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .panel {
            flex: 1;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            min-width: 320px;
        }
        
        .engine-info {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid #8b5cf6;
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            color: #cbd5e1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            line-height: 1.5;
        }
        .engine-info strong { color: #f8fafc; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, input { 
            padding: 0.75rem; 
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc;
            border-radius: 6px; 
            font-size: 0.95rem; 
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: #3b82f6; }
        
        button { 
            background: linear-gradient(to right, #3b82f6, #6366f1);
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            padding: 0.8rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); 
            filter: brightness(1.1);
        }
        button:active { transform: translateY(0); }
        button:disabled { background: #475569; cursor: not-allowed; box-shadow: none; color: #94a3b8; }
        
        .btn-green { background: linear-gradient(to right, #10b981, #059669); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn-green:hover { box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }
        
        .btn-red { background: linear-gradient(to right, #ef4444, #dc2626); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }
        .btn-red:hover { box-shadow: 0 6px 15px rgba(239, 68, 68, 0.4); }

        .btn-orange { background: linear-gradient(to right, #f59e0b, #d97706); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
        .btn-orange:hover { box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4); }
        
        .history {
            flex: 1;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .history-item {
            cursor: pointer;
            padding: 8px 10px;
            background-color: rgba(255,255,255,0.02);
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .history-item:hover { 
            background-color: rgba(59, 130, 246, 0.1); 
            border-color: rgba(59, 130, 246, 0.3); 
        }
        
        .model-badge {
            font-size: 0.65rem;
            background: linear-gradient(45deg, #4f46e5, #8b5cf6);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: auto; /* Pushes to the right */
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        
        .status { 
            font-weight: 600; 
            padding: 0.8rem; 
            border-radius: 6px; 
            background: rgba(255,255,255,0.05);
            text-align: center;
        }
        .error { color: #fca5a5; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        .success { color: #86efac; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
    <!-- Import Maps for React without bundler -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-chessboard": "https://esm.sh/react-chessboard@4.7.2?external=react,react-dom",
        "chess.js": "https://esm.sh/chess.js@1.0.0-beta.8",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
